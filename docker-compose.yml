
services:
  db:
    image: postgres:16
    container_name: voxcare_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: voxcare_db
      POSTGRES_USER: voxcare_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}

    ports:
      - "5432:5432"

    volumes:
      - voxcare_data:/var/lib/postgresql/data

volumes:
  voxcare_data:
